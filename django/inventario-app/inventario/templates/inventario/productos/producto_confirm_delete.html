{% extends 'inventario/base.html' %}

{% block title %}Confirmar Eliminacion{% endblock %}

{% block content %}
    <h1>Confirmar Eliminacion</h1>
    <p>Estas seguro de que quieres eliminar el producto "{{ producto.nombre }}"</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Si, eliminar</button>
        <a href="{% url 'producto_list' %}">Cancelar</a>
    </form>
{% endblock %}
