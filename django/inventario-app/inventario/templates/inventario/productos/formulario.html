{% extends 'inventario/base.html' %}

{% block title %}{%if form.instance.pk %}Editar Producto{% else %}Crear Producto{% endif %}{% endblock %}

{% block content %}
    <h1>{%if form.instance.pk %}Editar Producto{% else %}Crear Producto{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <p>
            <button type="submit">Guardar</button>
            <a href="{% url 'producto_list' %}">Cancelar</a>
        </p>
    </form>
{% endblock %}
